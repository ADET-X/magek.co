<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doodsadt - Video Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        video::-webkit-media-controls-enclosure {
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-black text-white relative">

    <header class="absolute top-0 left-0 w-full flex justify-between items-center py-3 px-4 bg-gradient-to-b from-black/80 to-transparent z-50 pointer-events-auto">
        <a href="/" class="text-lg font-black tracking-wider text-white drop-shadow-md">
            doods<span class="text-blue-500">adt</span>
        </a>
        <a href="/" class="bg-gray-800/80 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-gray-700 backdrop-blur shadow">
            Upload Baru
        </a>
    </header>

    <main id="app" class="w-full h-full flex items-center justify-center">
    </main>

    <script>
        // === PENGATURAN AKUN CATBOX ===
        const USER_HASH = 'c7f05658c770a3e71b59d6450';
        // ==============================

        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v') || urlParams.get('id');
        const appDiv = document.getElementById('app');

        if (videoId) {
            // MODE NONTON
            const videoUrl = `https://files.catbox.moe/${videoId}`;
            appDiv.innerHTML = `
                <video src="${videoUrl}" 
                       controls 
                       autoplay 
                       playsinline 
                       class="w-full h-full object-contain outline-none bg-black">
                    Browser kamu tidak mendukung pemutar video HTML5.
                </video>
            `;
        } else {
            // MODE UPLOAD
            appDiv.innerHTML = `
                <div class="w-full max-w-md bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl text-center m-4 relative z-40">
                    <h2 class="text-xl font-bold text-white mb-2">Upload Video</h2>
                    <p class="text-xs text-gray-400 mb-6">File masuk ke akun Catbox-mu (Maks 100MB untuk kestabilan).</p>
                    
                    <div class="py-10 px-4 border-2 border-dashed border-gray-700 rounded-xl bg-gray-950/50 mb-6 transition-all hover:border-blue-500 cursor-pointer" onclick="document.getElementById('fileInput').click()">
                        <svg class="mx-auto h-10 w-10 text-gray-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-xs font-semibold text-gray-300">Klik untuk memilih video</p>
                        <input type="file" id="fileInput" accept="video/*" class="hidden" onchange="updateFileName(this)" />
                        <p id="fileNameDisplay" class="mt-2 text-xs text-blue-400 font-mono font-bold hidden"></p>
                    </div>
                    
                    <button id="uploadBtn" onclick="mulaiUpload()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl w-full font-bold transition-all text-sm shadow-lg disabled:opacity-50">
                        Upload Sekarang
                    </button>

                    <!-- Progress Bar -->
                    <div id="progressContainer" class="hidden mt-5">
                        <div class="flex justify-between text-xs font-semibold text-gray-400 mb-1">
                            <span id="progressText">Mengunggah...</span>
                            <span id="progressPercent">0%</span>
                        </div>
                        <div class="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden">
                            <div id="progressBar" class="bg-blue-500 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <!-- Hasil Upload -->
                    <div id="resultBox" class="hidden mt-5 bg-green-950/40 p-3 rounded-xl border border-green-800 text-left">
                        <p class="text-green-400 font-bold mb-1 text-xs">✅ Berhasil Diunggah!</p>
                        <div class="flex gap-2">
                            <input type="text" id="shareLink" class="w-full p-1.5 border border-green-700 rounded-lg bg-gray-950 text-green-300 font-mono text-xs outline-none" readonly />
                            <button onclick="copyLink()" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap">Salin</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files.length > 0) {
                display.innerText = "File: " + input.files[0].name;
                display.classList.remove('hidden');
            }
        }

        function mulaiUpload() {
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            const progressText = document.getElementById('progressText');
            const resultBox = document.getElementById('resultBox');
            const shareLink = document.getElementById('shareLink');

            if (fileInput.files.length === 0) {
                alert('Pilih video terlebih dahulu!');
                return;
            }

            const file = fileInput.files[0];

            // ⚠️ PERHATIAN: Cloudflare Pages gratis membatasi payload di 100MB
            if (file.size > 99 * 1024 * 1024) {
                alert('Batas maksimal via proxy adalah 99MB! Silakan gunakan file lebih kecil.');
                return;
            }

            // Siapkan UI
            uploadBtn.disabled = true;
            resultBox.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressPercent.innerText = '0%';
            progressText.innerText = 'Mengunggah ke server...';
            progressText.className = 'text-gray-400 text-xs font-semibold';

            // Form persis seperti API Catbox
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('userhash', USER_HASH);
            formData.append('fileToUpload', file);

            const xhr = new XMLHttpRequest();

            // Progress bar
            xhr.upload.addEventListener("progress", (event) => {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    progressBar.style.width = percentComplete + '%';
                    progressPercent.innerText = percentComplete + '%';
                    
                    if (percentComplete === 100) {
                        progressText.innerText = 'Meneruskan ke Catbox... (tunggu sebentar)';
                    }
                }
            });

            // Selesai
            xhr.addEventListener("load", () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    const responseText = xhr.responseText.trim();
                    
                    if (responseText.startsWith('http')) {
                        const fileCode = responseText.split('/').pop();
                        const finalUrl = `${window.location.origin}${window.location.pathname}?v=${fileCode}`;
                        
                        progressContainer.classList.add('hidden');
                        resultBox.classList.remove('hidden');
                        shareLink.value = finalUrl;
                    } else {
                        showError("Gagal: " + responseText);
                    }
                } else {
                    showError("Server error: " + xhr.responseText);
                }
                uploadBtn.disabled = false;
            });

            xhr.addEventListener("error", () => {
                showError("Koneksi terputus saat mengunggah.");
                uploadBtn.disabled = false;
            });

            // Tembak ke fungsi backend proxy kita (bukan ke Catbox langsung)
            xhr.open("POST", "/api/catbox", true);
            xhr.send(formData);

            function showError(msg) {
                progressText.innerText = msg;
                progressText.className = 'text-red-400 text-xs font-semibold mt-1';
                progressBar.classList.remove('bg-blue-500');
                progressBar.classList.add('bg-red-500');
            }
        }

        function copyLink() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(linkInput.value).then(() => {
                alert('Link berhasil disalin!');
            }).catch(() => {
                document.execCommand('copy');
                alert('Link disalin!');
            });
        }
    </script>
</body>
</html>
