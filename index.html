<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-between p-4 md:p-6">

    <!-- Header / Navbar Minimalis (Logo Kiri, Tombol Kanan) -->
    <header class="w-full max-w-5xl flex justify-between items-center py-3 px-2">
        <a href="/" class="text-xl md:text-2xl font-black tracking-wider text-white">
            videy<span class="text-blue-500">clone</span>
        </a>
        <a href="/" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition border border-gray-700 shadow-sm">
            Upload Baru
        </a>
    </header>

    <!-- Container Utama (Dibuat Lebih Lebar & Besar) -->
    <main id="app" class="w-full max-w-5xl flex-grow flex flex-col items-center justify-center my-4">
        <!-- Konten di-inject via JS -->
    </main>

    <!-- Footer Minimalis -->
    <footer class="w-full max-w-5xl text-center py-4 text-xs text-gray-500">
        &copy; 2026 Videy Clone. Fast & Secure Streaming.
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        const appDiv = document.getElementById('app');

        if (videoId) {
            // ==========================================
            // TAMPILAN PEMUTAR VIDEO BESAR (UKURAN LEBAR/WIDE)
            // ==========================================
            appDiv.innerHTML = `
                <div class="w-full flex flex-col items-center">
                    <!-- Kotak Video Besar -->
                    <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800 relative aspect-video max-h-[80vh]">
                        <iframe src="https://dood.to/e/${videoId}" 
                                class="absolute top-0 left-0 w-full h-full border-0" 
                                scrolling="no" frameborder="0" allowfullscreen>
                        </iframe>
                    </div>
                    
                    <!-- Tombol Aksi di Bawah Video -->
                    <div class="mt-6 flex flex-wrap justify-center gap-3">
                        <button onclick="copyCurrentUrl()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm transition shadow-lg flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                            Copy Link Video
                        </button>
                    </div>
                </div>
            `;
        } else {
            // ==========================================
            // TAMPILKAN FORM UPLOAD BERSIH & LUAS
            // ==========================================
            appDiv.innerHTML = `
                <div class="w-full max-w-xl bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl text-center">
                    <h2 class="text-2xl font-bold text-white mb-2">Upload Video</h2>
                    <p class="text-sm text-gray-400 mb-6">Pilih video dari perangkatmu untuk dibagikan secara instan.</p>
                    
                    <div class="py-12 px-4 border-2 border-dashed border-gray-700 rounded-xl bg-gray-950/50 mb-6 transition-all hover:border-blue-500 cursor-pointer" onclick="document.getElementById('fileInput').click()">
                        <svg class="mx-auto h-12 w-12 text-gray-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-sm font-semibold text-gray-300">Klik untuk memilih video</p>
                        <p class="text-xs text-gray-500 mt-1">Format MP4, MKV, WebM</p>
                        <input type="file" id="fileInput" accept="video/*" class="hidden" onchange="updateFileName(this)" />
                        <p id="fileNameDisplay" class="mt-3 text-xs text-blue-400 font-mono font-bold hidden"></p>
                    </div>
                    
                    <button id="uploadBtn" onclick="mulaiUpload()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl w-full font-bold transition-all text-base shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
                        Upload Sekarang
                    </button>

                    <p id="statusText" class="mt-4 text-sm font-semibold text-gray-400 hidden"></p>
                    
                    <div id="resultBox" class="mt-6 hidden bg-green-950/40 p-4 rounded-xl border border-green-800 text-left">
                        <p class="text-green-400 font-bold mb-2 text-sm">✅ Video Berhasil Diunggah!</p>
                        <div class="flex gap-2">
                            <input type="text" id="shareLink" class="w-full p-2 border border-green-700 rounded-lg bg-gray-950 text-green-300 font-mono text-xs outline-none" readonly />
                            <button onclick="copyLink()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition whitespace-nowrap shadow-sm">Salin</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files.length > 0) {
                display.innerText = "File terpilih: " + input.files[0].name;
                display.classList.remove('hidden');
            }
        }

        async function mulaiUpload() {
            const fileInput = document.getElementById('fileInput');
            const statusText = document.getElementById('statusText');
            const uploadBtn = document.getElementById('uploadBtn');
            const resultBox = document.getElementById('resultBox');
            const shareLink = document.getElementById('shareLink');

            if (fileInput.files.length === 0) {
                alert('Pilih video terlebih dahulu!');
                return;
            }

            const file = fileInput.files[0];
            statusText.classList.remove('hidden', 'text-red-400');
            statusText.classList.add('text-gray-400');
            statusText.innerText = "Mengunggah video ke server... (Mohon tunggu)";
            uploadBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('file', file);

                const uploadRes = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await uploadRes.json();
                
                if (!data.success) {
                    throw new Error(data.error || "Gagal mengunggah video.");
                }
                
                const fileCode = data.filecode;
                const currentDomain = window.location.origin + window.location.pathname;
                const finalLink = `${currentDomain}?v=${fileCode}`;
                
                statusText.classList.add('hidden');
                resultBox.classList.remove('hidden');
                shareLink.value = finalLink;

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error: " + error.message;
                statusText.classList.remove('text-gray-400');
                statusText.classList.add('text-red-400');
            } finally {
                uploadBtn.disabled = false;
            }
        }

        function copyLink() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            document.execCommand('copy');
            alert('Link berhasil disalin!');
        }

        function copyCurrentUrl() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link video disalin!');
        }
    </script>
</body>
</html>
