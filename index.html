<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy Clone - Storage.to (Akun Resmi)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Navbar Minimalis -->
    <div class="w-full max-w-3xl mb-4 flex justify-between items-center">
        <h1 class="text-2xl font-extrabold tracking-tight">videy<span class="text-blue-600">clone</span></h1>
        <a href="/" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-md text-sm font-bold transition">Upload Baru</a>
    </div>

    <!-- Container Utama -->
    <div id="app" class="w-full max-w-3xl bg-white p-8 rounded-xl shadow-lg text-center">
        <!-- Konten akan di-inject oleh JavaScript -->
    </div>

    <script>
        // --- KONFIGURASI STORAGE.TO MENGGUNAKAN API KEY AKUN ---
        const STORAGE_API_KEY = '446|sdXYj9RoyQKrZ2c8bcdHhtdQTyfmHvSKOUK8vGXEc45758cb';

        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        const appDiv = document.getElementById('app');

        if (videoId) {
            // TAMPILKAN VIDEO MENGGUNAKAN IFRAME STORAGE.TO
            appDiv.innerHTML = `
                <div class="relative w-full rounded-lg overflow-hidden bg-black shadow-inner pb-[56.25%] h-0">
                    <iframe src="https://storage.to/${videoId}" 
                            class="absolute top-0 left-0 w-full h-full border-0" 
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="mt-6 flex justify-center gap-4">
                    <button onclick="copyCurrentUrl()" class="bg-blue-100 text-blue-700 px-6 py-2 rounded-md font-bold hover:bg-blue-200 transition">
                        Copy Link Video
                    </button>
                </div>
            `;
        } else {
            // TAMPILKAN FORM UPLOAD
            appDiv.innerHTML = `
                <div class="py-10 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 mb-6">
                    <h2 class="mt-2 text-xl font-bold text-gray-700">Pilih Video</h2>
                    <p class="text-sm text-gray-500 mb-4">Maksimal 50MB (Tersimpan otomatis ke Dashboard akunmu)</p>
                    
                    <input type="file" id="fileInput" accept="video/mp4,video/webm" class="block w-full max-w-xs mx-auto text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100 cursor-pointer" />
                </div>
                
                <button id="uploadBtn" onclick="mulaiUpload()" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 w-full font-bold transition-all text-lg shadow-md">
                    Upload Video Sekarang
                </button>

                <p id="statusText" class="mt-4 text-sm font-semibold text-gray-600 hidden"></p>
                
                <div id="resultBox" class="mt-6 hidden bg-green-50 p-4 rounded-lg border border-green-200 text-left">
                    <p class="text-green-800 font-bold mb-2">✅ Video Berhasil Diunggah ke Akunmu!</p>
                    <div class="flex gap-2">
                        <input type="text" id="shareLink" class="w-full p-2 border border-green-300 rounded bg-white text-gray-700 font-mono text-sm outline-none" readonly />
                        <button onclick="copyLink()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 text-sm font-bold transition whitespace-nowrap">Salin</button>
                    </div>
                </div>
            `;
        }

        async function mulaiUpload() {
            const fileInput = document.getElementById('fileInput');
            const statusText = document.getElementById('statusText');
            const uploadBtn = document.getElementById('uploadBtn');
            const resultBox = document.getElementById('resultBox');
            const shareLink = document.getElementById('shareLink');

            if (fileInput.files.length === 0) {
                alert('Pilih video terlebih dahulu!');
                return;
            }

            const file = fileInput.files[0];
            
            // Batasan 50MB (Batas amannya single-upload tanpa multipart)
            if (file.size > 50 * 1024 * 1024) {
                alert('Untuk kode frontend statis ini, ukuran file maksimal adalah 50MB.');
                return;
            }

            statusText.classList.remove('hidden', 'text-red-500');
            statusText.classList.add('text-gray-600');
            uploadBtn.disabled = true;
            uploadBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // TAHAP 1: INIT (Mendapatkan URL R2 dengan otentikasi akun)
                statusText.innerText = "Langkah 1/3: Meminta akses ke server...";
                const initUrl = encodeURIComponent('https://storage.to/api/upload/init');
                const initRes = await fetch(`https://corsproxy.io/?${initUrl}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${STORAGE_API_KEY}` // Menggunakan API Key
                    },
                    body: JSON.stringify({
                        filename: file.name,
                        content_type: file.type,
                        size: file.size
                    })
                });
                const initData = await initRes.json();

                if (!initData.success || initData.type !== 'single') {
                    throw new Error("Gagal inisiasi. Pastikan API Key valid atau file tidak melebihi 50MB.");
                }

                // TAHAP 2: UPLOAD (Upload file ke Cloudflare R2 secara langsung)
                statusText.innerText = "Langkah 2/3: Mengunggah file video (Mohon tunggu)...";
                const uploadRes = await fetch(initData.upload_url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': file.type
                    },
                    body: file
                });

                if (!uploadRes.ok) {
                    throw new Error("Gagal mengunggah file ke penyimpanan awan.");
                }

                // TAHAP 3: CONFIRM (Menyelesaikan unggahan di server Storage.to)
                statusText.innerText = "Langkah 3/3: Mengonfirmasi unggahan ke akunmu...";
                const confirmUrl = encodeURIComponent('https://storage.to/api/upload/confirm');
                const confirmRes = await fetch(`https://corsproxy.io/?${confirmUrl}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${STORAGE_API_KEY}` // Menggunakan API Key
                    },
                    body: JSON.stringify({
                        filename: file.name,
                        size: file.size,
                        content_type: file.type,
                        r2_key: initData.r2_key
                    })
                });
                const confirmData = await confirmRes.json();

                if (confirmData.success) {
                    const fileId = confirmData.file.id;
                    
                    // Buat tautan menggunakan domain GitHub Pages milikmu
                    const currentDomain = window.location.origin + window.location.pathname;
                    const finalLink = `${currentDomain}?v=${fileId}`;
                    
                    statusText.classList.add('hidden');
                    resultBox.classList.remove('hidden');
                    shareLink.value = finalLink;
                } else {
                    throw new Error("Gagal mengonfirmasi unggahan.");
                }

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error: " + error.message;
                statusText.classList.remove('text-gray-600');
                statusText.classList.add('text-red-500');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function copyLink() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            document.execCommand('copy');
            alert('Link berhasil disalin!');
        }

        function copyCurrentUrl() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link video disalin!');
        }
    </script>
</body>
</html>
