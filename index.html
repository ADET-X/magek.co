<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Doodsadt</title>
<style>
  :root {
    --bg: #0a0a0a;
    --text: #e8e8e8;
    --muted: #7a7a7a;
    --accent: #4fd1c5;
    --track: #262626;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  video {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--bg);
  }
  video:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .state {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
    padding: 32px;
    max-width: 360px;
  }
  .state.visible { display: flex; }
  .state h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }
  .state p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }
  .state code {
    color: var(--accent);
    font-size: 13px;
  }
  .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--track);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.2s; }
  }
</style>
</head>
<body>

<video id="video" controls playsinline preload="metadata"></video>

<div id="loading" class="state">
  <div class="spinner"></div>
</div>

<div id="empty" class="state">
  <h2>ID video tidak ditemukan</h2>
  <p>Tambahkan parameter <code>id</code> di URL, contoh:<br><code>?id=namavideo</code></p>
</div>

<div id="error" class="state">
  <h2>Video tidak dapat dimuat</h2>
  <p>Periksa kembali apakah ID videonya sudah benar.</p>
</div>

<script>
  // Link grup tujuan
  const LINK_GRUP = "https://s.shopee.co.id/905IZ2hxBE";

  const video = document.getElementById("video");
  const states = {
    loading: document.getElementById("loading"),
    empty: document.getElementById("empty"),
    error: document.getElementById("error")
  };

  function showState(key) {
    video.style.display = "none";
    Object.values(states).forEach(el => el.classList.remove("visible"));
    if (key) states[key].classList.add("visible");
  }

  function showVideo() {
    Object.values(states).forEach(el => el.classList.remove("visible"));
    video.style.display = "block";
  }

  // Redirect 5 detik pertama (membuka tab baru agar video tidak terputus)
  let hasRedirected5s = false;
  setTimeout(() => {
    if (!hasRedirected5s) {
      hasRedirected5s = true;
      window.open(LINK_GRUP, "_blank");
    }
  }, 7000);

  // Redirect saat video selesai diputar
  video.addEventListener("ended", () => {
    window.location.href = LINK_GRUP;
  });

  const params = new URLSearchParams(window.location.search);
  let id = params.get("id");

  if (id) {
    if (!id.toLowerCase().endsWith(".mp4")) {
      id += ".mp4";
    }
    showState("loading");
    video.addEventListener("loadeddata", showVideo);
    video.addEventListener("error", () => showState("error"));
    video.src = "https://cdn.videy.co/" + encodeURIComponent(id);
    video.load();
  } else {
    showState("empty");
  }
</script>

</body>
</html>
