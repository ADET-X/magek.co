    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;

<body class="bg-black text-gray-100 font-sans">

    <!-- Header Minimalis (Nama Brand & Tombol Upload) -->
    <header class="w-full flex justify-between items-center py-3 px-4 bg-gray-950 border-b border-gray-900 z-10 shrink-0">
        <a href="/" class="text-lg font-black tracking-wider text-white">
            doods<span class="text-blue-500">adt</span>
        </a>
        <a href="/" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-gray-700">
            Upload Baru
        </a>
    </header>

    <!-- Container Utama -->
    <main id="app" class="w-full flex-grow flex items-center justify-center bg-black overflow-hidden relative">
        <!-- Konten di-inject via JS -->
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v') || urlParams.get('id');
        const appDiv = document.getElementById('app');

        if (videoId) {
            // TAMPILKAN VIDEO FULL LAYAR MENYESUAIKAN UKURAN LAYAR TANPA TERPOTONG
            appDiv.innerHTML = `
                <div class="w-full h-full flex items-center justify-center bg-black">
                    <iframe src="https://dood.to/e/${videoId}" 
                            class="w-full h-full border-0" 
                            scrolling="no" frameborder="0" allowfullscreen>
                    </iframe>
                </div>
            `;
        } else {
            // TAMPILKAN FORM UPLOAD
            appDiv.innerHTML = `
                <div class="w-full max-w-md bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl text-center m-4">
                    <h2 class="text-xl font-bold text-white mb-2">Upload Video</h2>
                    <p class="text-xs text-gray-400 mb-6">Pilih video dari perangkatmu untuk dibagikan.</p>
                    
                    <div class="py-10 px-4 border-2 border-dashed border-gray-700 rounded-xl bg-gray-950/50 mb-6 transition-all hover:border-blue-500 cursor-pointer" onclick="document.getElementById('fileInput').click()">
                        <svg class="mx-auto h-10 w-10 text-gray-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-xs font-semibold text-gray-300">Klik untuk memilih video</p>
                        <input type="file" id="fileInput" accept="video/*" class="hidden" onchange="updateFileName(this)" />
                        <p id="fileNameDisplay" class="mt-2 text-xs text-blue-400 font-mono font-bold hidden"></p>
                    </div>
                    
                    <button id="uploadBtn" onclick="mulaiUpload()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl w-full font-bold transition-all text-sm shadow-lg disabled:opacity-50">
                        Upload Sekarang
                    </button>

                    <p id="statusText" class="mt-4 text-xs font-semibold text-gray-400 hidden"></p>
                    
                    <div id="resultBox" class="mt-4 hidden bg-green-950/40 p-3 rounded-xl border border-green-800 text-left">
                        <p class="text-green-400 font-bold mb-1 text-xs">✅ Berhasil!</p>
                        <div class="flex gap-2">
                            <input type="text" id="shareLink" class="w-full p-1.5 border border-green-700 rounded-lg bg-gray-950 text-green-300 font-mono text-xs outline-none" readonly />
                            <button onclick="copyLink()" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap">Salin</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files.length > 0) {
                display.innerText = "File: " + input.files[0].name;
                display.classList.remove('hidden');
            }
        }

        async function mulaiUpload() {
            const fileInput = document.getElementById('fileInput');
            const statusText = document.getElementById('statusText');
            const uploadBtn = document.getElementById('uploadBtn');
            const resultBox = document.getElementById('resultBox');
            const shareLink = document.getElementById('shareLink');

            if (fileInput.files.length === 0) {
                alert('Pilih video terlebih dahulu!');
                return;
            }

            const file = fileInput.files[0];
            statusText.classList.remove('hidden', 'text-red-400');
            statusText.classList.add('text-gray-400');
            statusText.innerText = "Mengunggah... (Mohon tunggu)";
            uploadBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('file', file);

                const uploadRes = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await uploadRes.json();
                
                if (!data.success) {
                    throw new Error(data.error || "Gagal mengunggah.");
                }
                
                const fileCode = data.filecode;
                const currentDomain = window.location.origin + window.location.pathname;
                const finalLink = `${currentDomain}?v=${fileCode}`;
                
                statusText.classList.add('hidden');
                resultBox.classList.remove('hidden');
                shareLink.value = finalLink;

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error: " + error.message;
                statusText.classList.remove('text-gray-400');
                statusText.classList.add('text-red-400');
            } finally {
                uploadBtn.disabled = false;
            }
        }

        function copyLink() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            document.execCommand('copy');
            alert('Link disalin!');
        }
    </script>
</body>
</html>
