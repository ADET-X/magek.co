<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy Clone - Doodstream</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center p-4">

    <!-- Navbar Minimalis -->
    <div class="w-full max-w-3xl mb-8 mt-4 flex justify-between items-center">
        <h1 class="text-2xl font-extrabold tracking-tight">videy<span class="text-blue-500">clone</span></h1>
        <a href="/" class="bg-gray-800 border border-gray-700 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-md text-sm font-bold transition">Upload Baru</a>
    </div>

    <!-- Container Utama -->
    <div id="app" class="w-full max-w-3xl bg-gray-800 border border-gray-700 p-8 rounded-xl shadow-xl text-center">
        <!-- Konten di-inject via JS -->
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        const appDiv = document.getElementById('app');

        if (videoId) {
            // TAMPILKAN PEMUTAR VIDEO DOODSTREAM (Iframe aman tanpa diblokir)
            appDiv.innerHTML = `
                <div class="relative w-full rounded-lg overflow-hidden bg-black shadow-inner pb-[56.25%] h-0">
                    <iframe src="https://dood.to/e/${videoId}" 
                            class="absolute top-0 left-0 w-full h-full border-0" 
                            scrolling="no" frameborder="0" allowfullscreen>
                    </iframe>
                </div>
                <div class="mt-6 flex justify-center gap-4">
                    <button onclick="copyCurrentUrl()" class="bg-blue-600 text-white px-6 py-2 rounded-md font-bold hover:bg-blue-700 transition shadow-sm">
                        Copy Link Video
                    </button>
                </div>
            `;
        } else {
            // TAMPILKAN FORM UPLOAD
            appDiv.innerHTML = `
                <div class="py-10 border-2 border-dashed border-gray-600 rounded-xl bg-gray-900/50 mb-6 transition-all hover:border-blue-500">
                    <h2 class="mt-2 text-xl font-bold text-gray-200">Pilih Video</h2>
                    <p class="text-sm text-gray-400 mb-4">Upload langsung ke Doodstream via Server</p>
                    
                    <input type="file" id="fileInput" accept="video/*" class="block w-full max-w-xs mx-auto text-sm text-gray-400
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-600 file:text-white
                        hover:file:bg-blue-700 cursor-pointer" />
                </div>
                
                <button id="uploadBtn" onclick="mulaiUpload()" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 w-full font-bold transition-all text-lg shadow-md">
                    Upload ke Doodstream
                </button>

                <p id="statusText" class="mt-4 text-sm font-semibold text-gray-400 hidden"></p>
                
                <div id="resultBox" class="mt-6 hidden bg-green-950/50 p-4 rounded-lg border border-green-800 text-left">
                    <p class="text-green-400 font-bold mb-2">✅ Video Berhasil Diunggah!</p>
                    <div class="flex gap-2">
                        <input type="text" id="shareLink" class="w-full p-2 border border-green-700 rounded bg-gray-900 text-green-300 font-mono text-sm outline-none" readonly />
                        <button onclick="copyLink()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 text-sm font-bold transition whitespace-nowrap shadow-sm">Salin</button>
                    </div>
                </div>
            `;
        }

        async function mulaiUpload() {
            const fileInput = document.getElementById('fileInput');
            const statusText = document.getElementById('statusText');
            const uploadBtn = document.getElementById('uploadBtn');
            const resultBox = document.getElementById('resultBox');
            const shareLink = document.getElementById('shareLink');

            if (fileInput.files.length === 0) {
                alert('Pilih video terlebih dahulu!');
                return;
            }

            const file = fileInput.files[0];
            statusText.classList.remove('hidden', 'text-red-400');
            statusText.classList.add('text-gray-400');
            statusText.innerText = "Mengunggah video ke Doodstream (Mohon tunggu)...";
            uploadBtn.disabled = true;
            uploadBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const formData = new FormData();
                formData.append('file', file);

                // Kirim ke backend Cloudflare Pages Functions sendiri
                const uploadRes = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await uploadRes.json();
                
                if (!data.success) {
                    throw new Error(data.error || "Gagal mengunggah video.");
                }
                
                const fileCode = data.filecode;
                const currentDomain = window.location.origin + window.location.pathname;
                const finalLink = `${currentDomain}?v=${fileCode}`;
                
                statusText.classList.add('hidden');
                resultBox.classList.remove('hidden');
                shareLink.value = finalLink;

            } catch (error) {
                console.error(error);
                statusText.innerText = "Error: " + error.message;
                statusText.classList.remove('text-gray-400');
                statusText.classList.add('text-red-400');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function copyLink() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            document.execCommand('copy');
            alert('Link berhasil disalin!');
        }

        function copyCurrentUrl() {
            navigator.clipboard.writeText(window.location.href);
            alert('Link video disalin!');
        }
    </script>
</body>
</html>
